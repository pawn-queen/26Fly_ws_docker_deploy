name: ${COMPOSE_PROJECT_NAME:-26fly}

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  args:
    BASE_IMAGE: ${BASE_IMAGE:-ultralytics/ultralytics:8.4.138-jetson-jetpack6}
    ULTRALYTICS_VERSION: ${ULTRALYTICS_VERSION:-8.4.138}
    USER_UID: ${HOST_UID:-1000}
    USER_GID: ${HOST_GID:-1000}

x-app-environment: &app-environment
  ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
  ROS_LOCALHOST_ONLY: "0"
  RMW_IMPLEMENTATION: rmw_fastrtps_cpp
  NVIDIA_VISIBLE_DEVICES: all
  NVIDIA_DRIVER_CAPABILITIES: all
  CMAKE_BUILD_PARALLEL_LEVEL: "${BUILD_JOBS:-2}"
  BUILD_JOBS: "${BUILD_JOBS:-2}"
  OMP_NUM_THREADS: "${OMP_NUM_THREADS:-2}"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  YOLO_AUTOINSTALL: "false"
  ROS_LOG_DIR: /workspace/log/ros
  HOME: /workspace/log/home
  ROS_HOME: /workspace/log/home/.ros
  XDG_CACHE_HOME: /workspace/log/cache
  TORCH_HOME: /workspace/log/cache/torch
  YOLO_CONFIG_DIR: /workspace/log/config/ultralytics
  MPLCONFIGDIR: /workspace/log/config/matplotlib
  COLCON_PACKAGES: "${COLCON_PACKAGES:-px4_msgs detect control}"
  DETECT_MODEL: "${DETECT_MODEL:-/workspace/src/detect/models/26n_0807_bright_needle.pt}"
  DETECT_CONFIDENCE: "${DETECT_CONFIDENCE:-0.4}"
  DETECT_COLOR_TOPIC: "${DETECT_COLOR_TOPIC:-/camera/camera/color/image_raw}"
  DETECT_DEPTH_TOPIC: "${DETECT_DEPTH_TOPIC:-/camera/camera/aligned_depth_to_color/image_raw}"
  DETECT_CAMERA_INFO_TOPIC: "${DETECT_CAMERA_INFO_TOPIC:-/camera/camera/color/camera_info}"
  DETECT_RECORD_VIDEO: "${DETECT_RECORD_VIDEO:-false}"
  DETECT_PUBLISH_LEGACY_TARGET: "${DETECT_PUBLISH_LEGACY_TARGET:-false}"
  CONTROL_MODEL: "${CONTROL_MODEL:-/workspace/src/fly/models/26n_0807_bright_needle.pt}"
  CONTROL_CAMERA_HINT: "${CONTROL_CAMERA_HINT:-imx577}"
  WIDE_CAMERA_DEVICE: "${WIDE_CAMERA_DEVICE:-/dev/video0}"
  CONTROL_RECORD_VIDEO: "${CONTROL_RECORD_VIDEO:-false}"
  CONTROL_REQUIRE_PX4_TOPICS: "${CONTROL_REQUIRE_PX4_TOPICS:-true}"
  ALLOW_FLIGHT_CONTROL: "${ALLOW_FLIGHT_CONTROL:-NO}"

x-workspace-volumes: &workspace-volumes
  - type: bind
    source: ${HOST_WS_SRC:-/home/queen/uav/26Season_Fly_ws_archive/src}
    target: /workspace/src
    read_only: true
    bind:
      create_host_path: false
  - type: bind
    source: ${HOST_MODEL_DIR:-/home/queen/uav/26Fly_ws_docker_deploy/models}
    target: /workspace/models
    read_only: true
    bind:
      create_host_path: false
  - type: volume
    source: ws-build
    target: /workspace/build
  - type: volume
    source: ws-install
    target: /workspace/install
  - type: volume
    source: ws-log
    target: /workspace/log

x-app-runtime: &app-runtime
  image: ${APP_IMAGE:-26fly-jetson:jp6-humble-ultralytics-8.4.138}
  build: *app-build
  platform: linux/arm64
  runtime: nvidia
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  working_dir: /workspace
  network_mode: host
  ipc: host
  init: true
  environment: *app-environment
  group_add:
    - "${VIDEO_GID:-44}"
    - "${DIALOUT_GID:-20}"
    - "${RENDER_GID:-110}"
    - "${PLUGDEV_GID:-46}"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  volumes: *workspace-volumes
  stop_signal: SIGINT
  stop_grace_period: 20s

services:
  # 默认服务：用于 VS Code attach、交互调试和 colcon build，不启动飞控。
  workspace:
    <<: *app-runtime
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]

  # 只运行实机 detect.detect_ros；不会调用 detect_ros_sim_lowHZ。
  detect:
    <<: *app-runtime
    profiles: ["detect"]
    command: ["run-detect"]

  # 只运行 control/0821auto.py；有显式开关、源码完整性、相机和 PX4 topic 检查。
  control:
    <<: *app-runtime
    profiles: ["control"]
    devices:
      - "${WIDE_CAMERA_DEVICE:-/dev/video0}:${WIDE_CAMERA_DEVICE:-/dev/video0}:rwm"
    command: ["run-control"]

  # RealSense 独立进程。只给该服务 USB 总线，不给整个 /dev 或 privileged。
  realsense:
    <<: *app-runtime
    profiles: ["camera"]
    volumes:
      - type: bind
        source: ${HOST_WS_SRC:-/home/queen/uav/26Season_Fly_ws_archive/src}
        target: /workspace/src
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOST_MODEL_DIR:-/home/queen/uav/26Fly_ws_docker_deploy/models}
        target: /workspace/models
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: ws-build
        target: /workspace/build
      - type: volume
        source: ws-install
        target: /workspace/install
      - type: volume
        source: ws-log
        target: /workspace/log
      - type: bind
        source: /dev/bus/usb
        target: /dev/bus/usb
        bind:
          create_host_path: false
      - type: bind
        source: /run/udev
        target: /run/udev
        read_only: true
        bind:
          create_host_path: false
    device_cgroup_rules:
      - "c 189:* rmw"
    command: ["run-camera"]

  # PX4 默认的 UDP Agent。Agent 与 ROS 应用隔离，避免 Fast DDS 动态库相互污染。
  xrce-agent-udp:
    image: ${XRCE_IMAGE:-26fly-xrce-agent:2.4.2}
    build:
      context: .
      dockerfile: Dockerfile.xrce-agent
      args:
        XRCE_AGENT_VERSION: ${XRCE_AGENT_VERSION:-v2.4.2}
        FAST_DDS_GIT_TAG: ${FAST_DDS_GIT_TAG:-v2.12.2}
        BUILD_JOBS: ${BUILD_JOBS:-2}
    platform: linux/arm64
    profiles: ["px4-udp"]
    network_mode: host
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["udp4", "-p", "${PX4_UDP_PORT:-8888}"]
    stop_signal: SIGINT

  # 串口 Agent 是唯一获得 PX4 串口访问权的服务。
  xrce-agent-serial:
    image: ${XRCE_IMAGE:-26fly-xrce-agent:2.4.2}
    build:
      context: .
      dockerfile: Dockerfile.xrce-agent
      args:
        XRCE_AGENT_VERSION: ${XRCE_AGENT_VERSION:-v2.4.2}
        FAST_DDS_GIT_TAG: ${FAST_DDS_GIT_TAG:-v2.12.2}
        BUILD_JOBS: ${BUILD_JOBS:-2}
    platform: linux/arm64
    profiles: ["px4-serial"]
    network_mode: host
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    user: "65532:65532"
    group_add:
      - "${DIALOUT_GID:-20}"
    devices:
      - "${PX4_SERIAL_DEVICE:-/dev/ttyACM1}:/dev/px4_fcu:rwm"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["serial", "--dev", "/dev/px4_fcu", "-b", "${PX4_BAUD:-921600}"]
    stop_signal: SIGINT

volumes:
  ws-build:
    name: "${VOLUME_PREFIX:-26fly-jp6-humble}-build"
  ws-install:
    name: "${VOLUME_PREFIX:-26fly-jp6-humble}-install"
  ws-log:
    name: "${VOLUME_PREFIX:-26fly-jp6-humble}-log"
